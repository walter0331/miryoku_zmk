# Dongle-only. These symbols exist solely under ZMK_SPLIT_ROLE_CENTRAL, so they
# cannot live in corne.conf (which is merged for the halves too, where an
# undefined symbol is a hard error).
#
# ZMK's defaults (latency 30, timeout 400 = 4s) break FRESH split pairing: SMP
# reaches the final DHKey check, the peripheral may defer its reply for up to 30
# connection events, and the 4s supervision timeout tears the link down
# mid-handshake — logged as "Security failed err 9", HCI reason 0x08. Bonded
# pairs skip SMP, so only a new central hits it. A dongle is always a new central.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=1000
