# Dongle-only. These symbols exist solely under ZMK_SPLIT_ROLE_CENTRAL, so they
# cannot live in corne.conf (which is merged for the halves too, where an
# undefined symbol is a hard error).
#
# ZMK's defaults (latency 30, timeout 400 = 4s) break FRESH split pairing: SMP
# reaches the final DHKey check, the peripheral may defer its reply for up to 30
# connection events, and the 4s supervision timeout tears the link down
# mid-handshake — logged as "Security failed err 9", HCI reason 0x08. Bonded
# pairs skip SMP, so only a new central hits it. A dongle is always a new central.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=1000

# The prospector_adapter shield's Kconfig.defconfig raises LVGL's rendering
# buffer to 50% of the display and turns on double buffering. That is two
# 67,200-byte blocks -- 51% of the 256KB of RAM on the chip, measured in
# zephyr_final.map as .bss.buf0 / .bss.buf1. Zephyr's own default is 10.
#
# Shrinking the buffers frees ~94KB while KEEPING double buffering, so LVGL
# still renders one chunk while the flush thread sends the previous one over
# SPI. Do NOT set LV_Z_DOUBLE_VDB=n instead: that saves the same RAM but
# serialises draw and flush, and Classic's layer roller (224x140, 100ms slide,
# ~3 frames at the 33ms refresh period) would drop a frame and step instead of
# sliding. A smaller buffer only costs one extra SPI window command per chunk.
CONFIG_LV_Z_VDB_SIZE=15
